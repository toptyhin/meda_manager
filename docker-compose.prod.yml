# Production stack: Traefik v3.7 + Let's Encrypt (HTTP-01) + app
#
# Prerequisites:
#   - DNS A/AAAA for DOMAIN → this host
#   - ports 80 and 443 free and reachable
#   - .env with DOMAIN, ACME_EMAIL, AGNES_API_KEY, JWT_SECRET
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f

services:
  traefik:
    image: traefik:v3.7.8
    container_name: media-manager-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=media_manager_proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Override via ACME_CA_SERVER for Let's Encrypt staging while testing certs
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - proxy
    mem_limit: 64m
    memswap_limit: 64m

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: media-manager:latest
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      FRONTEND_DIST: /app/frontend/dist
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - mm-data:/data
    restart: unless-stopped
    mem_limit: 180m
    memswap_limit: 180m
    expose:
      - "8000"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=media_manager_proxy
      - traefik.http.routers.media-manager.rule=Host(`${DOMAIN:?set DOMAIN in .env}`)
      - traefik.http.routers.media-manager.entrypoints=websecure
      - traefik.http.routers.media-manager.tls=true
      - traefik.http.routers.media-manager.tls.certresolver=letsencrypt
      - traefik.http.services.media-manager.loadbalancer.server.port=8000
      # Security headers
      - traefik.http.middlewares.media-manager-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.media-manager-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.media-manager-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.media-manager-headers.headers.frameDeny=true
      - traefik.http.middlewares.media-manager-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.routers.media-manager.middlewares=media-manager-headers

networks:
  proxy:
    name: media_manager_proxy

volumes:
  mm-data:
  letsencrypt:
