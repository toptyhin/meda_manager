[project]
name = "media-manager"
version = "0.1.0"
description = "Lightweight media manager with Agnes AI image generation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    # aiosqlite: only for the one-off scripts/migrate_sqlite_to_pg.py reader.
    # Runtime DB is Postgres (asyncpg) exclusively.
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "pillow>=11.0.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9.0",
    "pwdlib[argon2]>=0.2.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
