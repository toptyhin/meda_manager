services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: media-manager:latest
    ports:
      - "${APP_PORT:-8080}:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      FRONTEND_DIST: /app/frontend/dist
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-media}:${POSTGRES_PASSWORD:-media-local-dev}@postgres:5432/${POSTGRES_DB:-media_manager}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mm-data:/data
    restart: unless-stopped
    # Pillow decode + thumb of phone photos needs headroom; 180m OOMs → Vite 502.
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-media}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-media-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-media_manager}
    ports:
      # Host access for local pytest / tools (prod compose does not publish this).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Creates media_manager_test on first volume init (for pytest).
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mm-data:
  pg-data:
