services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: media-manager:latest
    ports:
      - "${APP_PORT:-8080}:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      FRONTEND_DIST: /app/frontend/dist
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - mm-data:/data
    restart: unless-stopped
    # Pillow decode + thumb of phone photos needs headroom; 180m OOMs → Vite 502.
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mm-data:
